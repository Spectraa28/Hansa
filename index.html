<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F9FC" />
    <!-- Applies a saved dark theme before the first paint, so the page never flashes light. -->
    <script>try { if (localStorage.getItem('hansa-theme') === 'dark') { document.documentElement.dataset.theme = 'dark'; document.querySelector('meta[name="theme-color"]').content = '#0A111D' } } catch (e) {}</script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/hanken-grotesk.woff2" as="font" type="font/woff2" crossorigin />
    <title>Hansa — An optimization engineer for your AI agent</title>
    <meta name="description" content="Hansa investigates your AI agent, tests code changes on your tasks, and returns a reviewable patch with measurements and regressions." />
  </head>
  <body>
    <!-- Painted straight from the HTML, before any script runs, so the first screen is never blank. React replaces it. -->
    <div id="root"><div style="height:71px;background:#182432;display:flex;align-items:center;padding:0 max(20px,4vw);gap:10px;font:600 21px system-ui,sans-serif;color:#F7F9FC;letter-spacing:-.02em"><img src="/brand/mark.svg" width="38" height="38" alt="">Hansa</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
